<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Alerta de stock bajo</title>
</head>
<body style="margin:0;padding:24px;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
<table role="presentation" width="100%" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;padding:32px;">
    <tr>
        <td>
            <h1 style="margin:0 0 16px;font-size:22px;color:#b45309;">Alerta de stock bajo</h1>
            <p style="margin:0 0 16px;line-height:1.5;">
                Hola, <span th:text="${nombre}">Rosa</span>. Después de la venta
                <strong th:text="'#' + ${ventaId}">#15</strong>, estas prendas llegaron a su stock mínimo:
            </p>
            <table role="presentation" width="100%" style="border-collapse:collapse;font-size:14px;">
                <thead>
                <tr style="background:#f9fafb;text-align:left;">
                    <th style="padding:8px;border-bottom:1px solid #e5e7eb;">Producto</th>
                    <th style="padding:8px;border-bottom:1px solid #e5e7eb;">Talla</th>
                    <th style="padding:8px;border-bottom:1px solid #e5e7eb;">Color</th>
                    <th style="padding:8px;border-bottom:1px solid #e5e7eb;text-align:right;">Stock</th>
                    <th style="padding:8px;border-bottom:1px solid #e5e7eb;text-align:right;">Mínimo</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="v : ${variantes}">
                    <td style="padding:8px;border-bottom:1px solid #f3f4f6;" th:text="${v.producto()}">Polo básico</td>
                    <td style="padding:8px;border-bottom:1px solid #f3f4f6;" th:text="${v.talla()}">M</td>
                    <td style="padding:8px;border-bottom:1px solid #f3f4f6;" th:text="${v.color()}">Negro</td>
                    <td style="padding:8px;border-bottom:1px solid #f3f4f6;text-align:right;font-weight:bold;color:#b45309;" th:text="${v.stock()}">2</td>
                    <td style="padding:8px;border-bottom:1px solid #f3f4f6;text-align:right;" th:text="${v.stockMinimo()}">5</td>
                </tr>
                </tbody>
            </table>
            <p style="margin:16px 0 0;line-height:1.5;">Te recomendamos reponer estas tallas pronto para no perder ventas.</p>
            <p style="margin:24px 0 0;font-size:12px;color:#6b7280;">Este es un mensaje automático, no es necesario responder.</p>
        </td>
    </tr>
</table>
</body>
</html>
