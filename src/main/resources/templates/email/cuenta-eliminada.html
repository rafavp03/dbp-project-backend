<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso retirado</title>
</head>
<body style="margin:0;padding:24px;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
<table role="presentation" width="100%" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;padding:32px;">
    <tr>
        <td>
            <h1 style="margin:0 0 16px;font-size:22px;color:#111827;">Hola, <span th:text="${nombre}">Luis</span></h1>
            <p style="margin:0 0 12px;line-height:1.5;">
                <strong th:text="${eliminadoPor}">Rosa Quispe</strong> retiró tu acceso a <strong>Tienda Clara</strong>
                para el negocio <strong th:text="${empresa}">Moda Gamarra SAC</strong>.
            </p>
            <p style="margin:0 0 12px;line-height:1.5;">
                Ya no podrás iniciar sesión con esta cuenta. Si crees que es un error, comunícate con el administrador del negocio.
            </p>
            <p style="margin:24px 0 0;font-size:12px;color:#6b7280;">Este es un mensaje automático, no es necesario responder.</p>
        </td>
    </tr>
</table>
</body>
</html>
