<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cambio de precio</title>
</head>
<body style="margin:0;padding:24px;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2937;">
<table role="presentation" width="100%" style="max-width:560px;margin:0 auto;background:#ffffff;border-radius:8px;padding:32px;">
    <tr>
        <td>
            <h1 style="margin:0 0 16px;font-size:22px;color:#111827;">Cambio de precio</h1>
            <p style="margin:0 0 16px;line-height:1.5;">
                Hola, <span th:text="${nombre}">Rosa</span>.
                <strong th:text="${modificadoPor}">Luis Huamán</strong> cambió los precios de
                <strong th:text="${producto}">POL-001 - Polo básico</strong>.
            </p>
            <table role="presentation" width="100%" style="border-collapse:collapse;font-size:14px;">
                <thead>
                <tr style="background:#f9fafb;text-align:left;">
                    <th style="padding:8px;border-bottom:1px solid #e5e7eb;"></th>
                    <th style="padding:8px;border-bottom:1px solid #e5e7eb;text-align:right;">Antes</th>
                    <th style="padding:8px;border-bottom:1px solid #e5e7eb;text-align:right;">Ahora</th>
                </tr>
                </thead>
                <tbody>
                <tr>
                    <td style="padding:8px;border-bottom:1px solid #f3f4f6;">Precio de venta</td>
                    <td style="padding:8px;border-bottom:1px solid #f3f4f6;text-align:right;"
                        th:text="${precioVentaAnterior != null} ? 'S/ ' + ${#numbers.formatDecimal(precioVentaAnterior, 1, 'COMMA', 2, 'POINT')} : '-'">S/ 25.00</td>
                    <td style="padding:8px;border-bottom:1px solid #f3f4f6;text-align:right;font-weight:bold;"
                        th:text="${precioVentaNuevo != null} ? 'S/ ' + ${#numbers.formatDecimal(precioVentaNuevo, 1, 'COMMA', 2, 'POINT')} : '-'">S/ 22.00</td>
                </tr>
                <tr>
                    <td style="padding:8px;border-bottom:1px solid #f3f4f6;">Costo</td>
                    <td style="padding:8px;border-bottom:1px solid #f3f4f6;text-align:right;"
                        th:text="${precioCompraAnterior != null} ? 'S/ ' + ${#numbers.formatDecimal(precioCompraAnterior, 1, 'COMMA', 2, 'POINT')} : '-'">S/ 12.00</td>
                    <td style="padding:8px;border-bottom:1px solid #f3f4f6;text-align:right;font-weight:bold;"
                        th:text="${precioCompraNuevo != null} ? 'S/ ' + ${#numbers.formatDecimal(precioCompraNuevo, 1, 'COMMA', 2, 'POINT')} : '-'">S/ 12.00</td>
                </tr>
                <tr>
                    <td style="padding:8px;">Margen bruto</td>
                    <td style="padding:8px;text-align:right;" th:text="${margenAnterior != null} ? ${margenAnterior} + ' %' : '-'">52.0 %</td>
                    <td style="padding:8px;text-align:right;font-weight:bold;" th:text="${margenNuevo != null} ? ${margenNuevo} + ' %' : '-'">45.5 %</td>
                </tr>
                </tbody>
            </table>
            <p style="margin:24px 0 0;font-size:12px;color:#6b7280;">Este es un mensaje automático, no es necesario responder.</p>
        </td>
    </tr>
</table>
</body>
</html>
