spring.application.name=project-backend

server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT (en produccion definir la variable de entorno JWT_SECRET)
jwt.secret=${JWT_SECRET:f+y40LrCwVSAXVbem3tdMUpxV6biJafF3bSdvEXudCiusms5K5wty7QMKvIfdxXd}
# 24 horas en milisegundos
jwt.expiration=${JWT_EXPIRATION:86400000}
