spring.application.name=project-backend

# Lee las variables del archivo .env de la raiz del proyecto (si existe).
# Las variables de entorno del sistema tienen prioridad sobre el .env.
spring.config.import=optional:file:.env[.properties]

server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=create-drop

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT (en produccion definir la variable de entorno JWT_SECRET)
jwt.secret=${JWT_SECRET:f+y40LrCwVSAXVbem3tdMUpxV6biJafF3bSdvEXudCiusms5K5wty7QMKvIfdxXd}
# 24 horas en milisegundos
jwt.expiration=${JWT_EXPIRATION:86400000}

# IA: Gemini (Google GenAI) via Spring AI
# La key se saca gratis en https://aistudio.google.com/apikey y va en el .env (nunca en el repo).
# El valor por defecto solo permite que la app arranque sin key; el asistente fallara hasta configurarla.
spring.ai.google.genai.api-key=${GEMINI_API_KEY:sin-configurar}
spring.ai.google.genai.chat.model=${GEMINI_MODEL:gemini-2.5-flash}
# Respuestas mas estables y cortas (menos creatividad, menos consumo de cuota)
spring.ai.google.genai.chat.temperature=0.3
spring.ai.google.genai.chat.max-output-tokens=1024
# Sin "razonamiento" interno: en Gemini 2.5 esos tokens cuentan dentro del limite de salida
spring.ai.google.genai.chat.thinking-budget=0

# Asistente: preguntas por usuario por dia (protege la cuota gratis de Gemini)
asistente.limite-diario=${ASISTENTE_LIMITE_DIARIO:30}
