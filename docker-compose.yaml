services:
  postgres:
    image: postgres:16-alpine
    container_name: dbp-project-backend
    restart: unless-stopped
    ports:
      - "${DB_PORT:-5432}:5432"
    environment:
        POSTGRES_DB: ${DB_NAME}
        POSTGRES_USER: ${DB_USER}
        POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      # Volumen con nombre: los datos sobreviven a reinicios y a "docker compose down".
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
